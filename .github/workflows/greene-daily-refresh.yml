name: Greene NY — Daily distress refresh

# Runs every adapter that can run unattended, rebuilds the dashboard
# payload, commits the refreshed artifacts, and deploys the static
# dashboard to GitHub Pages. The NEW-today / Last-30-days tags are
# computed against the workflow's UTC date, so each daily run produces
# a deterministic NEW set that all viewers see identically.
#
# CI-runnable sources (no operator input):
#   - tax_foreclosure_auction   AAR catalog discovery + pull
#                                (server-rendered, stdlib-reachable;
#                                seasonal — outside auction window the
#                                last good JSONL is preserved)
#   - tax_foreclosure_petition  Treasurer Annual Petition PDF + OCR
#                                (tesseract + poppler installed below)
#   - legal_notices_column      Column legal notices API
#                                (Greene-property filter applied)
#
# CI-BLOCKED sources (require operator-supplied cookies — Cloudflare
# Managed Challenge fires on every actionable request even with
# playwright-stealth, see runs/greene_ny/recon/stealth_recon_2026-05-25.md):
#   - clerk_land_records       SearchIQS (cf_clearance + ASP.NET session)
#   - supreme_court_foreclosure NYSCEF Supreme (cf_clearance + JSESSIONID)
#   - surrogate_court_probate   NYSCEF Surrogate (same cookies)
#   - webcivil_supreme          WebCivil Supreme (cf_clearance)
#   - websurrogate              WebSurrogate (cf_clearance)
# Once an operator pastes cookie values into GitHub Actions secrets
# (`SEARCHIQS_COOKIES`, `NYSCEF_COOKIES`), add steps that export those
# env vars and invoke the stealth adapters. The adapters themselves are
# not yet implemented; they are punch-listed.

on:
  schedule:
    # 11:17 UTC daily ≈ 7:17 AM ET — late enough that
    # newspaper-published legal notices for the day are in place, and
    # early enough that the lead board is fresh for the operator.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      auction_id:
        description: "Optional AAR auctionId override (default: discover)"
        required: false
        type: string
      refresh_parcel_master:
        description: "Re-pull the NYS parcel_master roll (~10 min, run when a new assessment roll year ships)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # commit refreshed data/ + dashboard/ back to main
  # GitHub Pages for this repo is configured in LEGACY branch-serving
  # mode (`build_type: legacy`, source = main / root). The commit step
  # below is the deploy mechanism — pushing `dashboard/*` to `main`
  # makes it live at https://xcerebroai.github.io/greene-ny-intel/
  # dashboard/ within ~60 s. No actions/deploy-pages needed.

concurrency:
  group: greene-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (tesseract + poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
          tesseract --version
          pdftoppm -v 2>&1 | head -1

      - name: Python deps (jsonschema for §4.32 contract validation)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-refresh.txt
          python -c "import jsonschema; print('jsonschema', jsonschema.__version__)"

      # parcel_master — NYS Tax Parcels Public roll, ~38k records, the
      # ENRICHMENT source that supplies owner names + addresses via
      # PRINT_KEY / Tax Map join. Committed to git as reference data;
      # the checkout step puts it on disk. We verify presence (so a
      # missing file fails LOUDLY instead of silently publishing all
      # "Unknown — UNKNOWN" leads, which is the 2026-05-25 regression
      # that triggered this work) and OPT-INTO a fresh re-pull only
      # when the operator explicitly requests it (new roll year).
      - name: parcel_master — verify enrichment data present
        run: |
          set -e
          test -f data/raw/parcel_master.jsonl
          rows=$(wc -l < data/raw/parcel_master.jsonl)
          size=$(wc -c < data/raw/parcel_master.jsonl)
          echo "parcel_master.jsonl: $rows rows, $size bytes"
          test "$rows" -gt 30000 || (echo "parcel_master row count $rows below 30000 — file is corrupt or stale"; exit 1)

      - name: parcel_master — re-pull (opt-in)
        if: ${{ inputs.refresh_parcel_master == true || inputs.refresh_parcel_master == 'true' }}
        run: |
          set -e
          echo "Refreshing NYS parcel_master roll (~10 min)…"
          python scrapers/parcel_master.py
          rows=$(wc -l < data/raw/parcel_master.jsonl)
          echo "Fresh parcel_master.jsonl: $rows rows"
          test "$rows" -gt 30000

      # AAR auction pulls — historical 3738 (2022, 87 lots) + current
      # discovery (or operator-supplied auctionId). `--append` merges
      # by raw_record_id so both auctions coexist in the JSONL.
      - name: AAR tax-foreclosure auction — historical 3738
        run: |
          set +e
          python scrapers/tax_foreclosure_auction.py --auction-id 3738 --append
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: AAR tax-foreclosure auction — current (discovery or override)
        id: aar
        run: |
          set +e
          if [ -n "${{ inputs.auction_id }}" ]; then
            python scrapers/tax_foreclosure_auction.py --auction-id "${{ inputs.auction_id }}" --append
          else
            python scrapers/tax_foreclosure_auction.py --auction-id 6892 --append
            # Plus seasonal-discovery for an active/upcoming Greene auction.
            python scrapers/tax_foreclosure_auction.py --append
          fi
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      # Treasurer petition pulls — historical text-layer years (2019,
      # 2020, 2022) via Wayback + current 2025 via the live county
      # site. `--append` keeps all years in the JSONL; auto text-layer
      # detection means tesseract only runs on the OCR-only years.
      - name: Treasurer petition — 2019 (text-layer, Wayback)
        run: |
          set +e
          python scrapers/tax_foreclosure_petition.py --petition-year 2019 \
            --petition-url "https://web.archive.org/web/2024id_/https://www.greenegovernment.com/wp-content/uploads/2019/04/2019-Petition-Notice-of-Foreclosure.pdf" \
            --append
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: Treasurer petition — 2020 (text-layer, Wayback)
        run: |
          set +e
          python scrapers/tax_foreclosure_petition.py --petition-year 2020 \
            --petition-url "https://web.archive.org/web/2024id_/https://www.greenegovernment.com/wp-content/uploads/2020/02/Petition-Notice-of-Foreclosure-2.20.2020.pdf" \
            --append
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: Treasurer petition — 2022 (text-layer, Wayback)
        run: |
          set +e
          python scrapers/tax_foreclosure_petition.py --petition-year 2022 \
            --petition-url "https://web.archive.org/web/2024id_/https://www.greenegovernment.com/wp-content/uploads/2022/05/Petition-Notice-of-Foreclosure-4.21.2022.pdf" \
            --append
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: Treasurer petition — 2025 (current, PDF + OCR)
        id: petition
        run: |
          set +e
          python scrapers/tax_foreclosure_petition.py --petition-year 2025 --append
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: Column legal notices (90-day window)
        id: column
        run: |
          set +e
          python scrapers/legal_notices_column.py --days-back 90
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: Run staged pipeline
        run: python runs/greene_ny/build/run_greene_pipeline.py

      - name: Rebuild dashboard payload (recency tagged)
        run: python runs/greene_ny/build/adapt_to_elpaso_renderer.py

      - name: Show refresh summary
        run: |
          python - <<'PY'
          import json
          d = json.load(open('dashboard/data.json'))
          print(f"refresh_date           : {d.get('refresh_date')}")
          print(f"lead_total             : {d.get('lead_total')}")
          print(f"actionable_leads       : {d.get('actionable_leads')}")
          print(f"parcel_master_resolved : {d.get('parcel_master_enrichment_resolved')}")
          print(f"new_today_count        : {d.get('new_today_count')}")
          print(f"last_30_days_count     : {d.get('last_30_days_count')}")
          # Sanity: enriched leads must vastly outnumber unenriched.
          enr = d.get('parcel_master_enrichment_resolved') or 0
          unenr = d.get('parcel_master_enrichment_unresolved') or 0
          assert enr >= 800, (
              f"parcel_master_enrichment_resolved={enr} (need ≥ 800) — "
              "parcel_master join did not run. Refusing to publish all-"
              "Unknown leads."
          )
          assert enr >= unenr, (
              f"resolved={enr} < unresolved={unenr} — enrichment broken; "
              "refusing to publish."
          )
          print("Enrichment sanity check OK.")
          PY

      - name: Commit refreshed artifacts
        env:
          GIT_COMMITTER_NAME: greene-refresh-bot
          GIT_COMMITTER_EMAIL: refresh-bot@xcerebro.local
          GIT_AUTHOR_NAME: greene-refresh-bot
          GIT_AUTHOR_EMAIL: refresh-bot@xcerebro.local
        run: |
          git config user.name "greene-refresh-bot"
          git config user.email "refresh-bot@xcerebro.local"
          # Pipeline outputs + dashboard payload commit to main.
          # data/raw/*.jsonl is gitignored EXCEPT parcel_master.jsonl
          # (reference data — only re-committed when the opt-in
          # `refresh_parcel_master` input fires this run).
          git add \
            data/dashboard.json \
            data/scored_leads.json \
            data/matched_leads.json \
            data/evidence_ledger.json \
            data/source_heartbeat.json \
            data/runs/latest.manifest.json \
            dashboard/data.json \
            dashboard/data.js \
            dashboard/data/dashboard.json \
            dashboard/data/scored_leads.json \
            dashboard/data/matched_leads.json \
            dashboard/data/evidence_ledger.json
          if [ "${{ inputs.refresh_parcel_master }}" = "true" ]; then
            git add data/raw/parcel_master.jsonl
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "greene-ny: daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      # Pages deploy IS the commit step above. Repo Pages is in legacy
      # main-branch serving mode; `actions/deploy-pages` would conflict
      # (it requires `build_type: workflow` + an `environment:
      # github-pages` deployment, neither of which is set here on
      # purpose). Live dashboard refreshes the moment the commit lands.

      - name: Verify dashboard live (count + enrichment sanity)
        run: |
          set -e
          # Expected values from THIS run's locally-built payload.
          expected_total=$(python -c "import json; d=json.load(open('dashboard/data.json')); print(d['lead_total'])")
          expected_enr=$(python -c "import json; d=json.load(open('dashboard/data.json')); print(d['parcel_master_enrichment_resolved'])")
          echo "Expected lead_total              : $expected_total"
          echo "Expected parcel_master_resolved  : $expected_enr"

          # Threshold guards. The 2026-05-25 regression published 1,180
          # leads with enrichment=0 — a count-only check would have
          # passed. The enrichment-resolved threshold below would have
          # caught it.
          MIN_TOTAL=800
          MIN_ENRICHED=800

          # Inline checker: fetches live data.json, prints summary
          # tuple, exits 0 if BOTH thresholds met AND lead_total matches
          # expected, 2 if total-only stale, 3 if enrichment broken,
          # 4 if HTTP fail.
          check_live () {
            python <<PY
          import json, sys, urllib.request
          try:
              with urllib.request.urlopen(
                  "https://xcerebroai.github.io/greene-ny-intel/dashboard/data.json",
                  timeout=20,
              ) as r:
                  d = json.loads(r.read())
          except Exception as e:
              print(f"LIVE_FETCH_FAIL: {e}")
              sys.exit(4)
          total = d.get("lead_total") or 0
          enr   = d.get("parcel_master_enrichment_resolved") or 0
          unenr = d.get("parcel_master_enrichment_unresolved") or 0
          actionable = d.get("actionable_leads") or 0
          # Spot-check actual records: any with empty addr + Unknown owner?
          rows = d.get("records") or []
          unknown_owner = sum(1 for r in rows if (r.get("owner_name") or "").strip() == "Unknown")
          empty_addr = sum(1 for r in rows if not (r.get("property_full_address") or "").strip())
          pct_unknown = (unknown_owner * 100 // max(1, len(rows)))
          pct_empty_addr = (empty_addr * 100 // max(1, len(rows)))
          print(f"LIVE total={total} enriched={enr} unenriched={unenr} "
                f"actionable={actionable} pct_owner_unknown={pct_unknown}% "
                f"pct_empty_addr={pct_empty_addr}%")
          # Hard gates
          if total < $MIN_TOTAL:
              print(f"FAIL: lead_total {total} < {$MIN_TOTAL}")
              sys.exit(2)
          if enr < $MIN_ENRICHED:
              print(f"FAIL: parcel_master_enrichment_resolved {enr} < {$MIN_ENRICHED} — "
                    "every lead would render as 'Unknown — UNKNOWN — No property address'")
              sys.exit(3)
          if pct_empty_addr > 30:
              print(f"FAIL: {pct_empty_addr}% of leads have no property_full_address (>30% threshold)")
              sys.exit(3)
          if pct_unknown > 50:
              print(f"FAIL: {pct_unknown}% of leads have owner_name='Unknown' (>50% threshold)")
              sys.exit(3)
          if actionable < 500:
              print(f"FAIL: actionable_leads {actionable} < 500 — board is mostly Unknown")
              sys.exit(3)
          # Soft: hasn't caught up to this run yet?
          if total != $expected_total:
              print(f"STALE: live total {total} != expected $expected_total — Pages cache still flushing")
              sys.exit(2)
              # exit 2 is retryable; exit 3 is hard fail
          sys.exit(0)
          PY
          }

          # Poll up to 8 minutes — exit 2 means "retry", any other
          # non-zero is a hard fail (enrichment broken or HTTP down).
          set +e
          for attempt in $(seq 1 32); do
            ts=$(date -u +%H:%M:%S)
            echo "[$ts attempt $attempt] checking live..."
            check_live
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "Live URL caught up + enrichment OK."
              exit 0
            fi
            if [ $rc -eq 3 ] || [ $rc -eq 4 ]; then
              echo "Hard fail (rc=$rc) — refusing to keep retrying."
              exit $rc
            fi
            sleep 15
          done
          echo "Live URL did not catch up within 8 min."
          # Final retry once more strictly — accept healthy stale if
          # enrichment is intact on whatever IS live.
          check_live
          rc=$?
          if [ $rc -eq 0 ]; then exit 0; fi
          echo "Final state did not pass — FAIL (rc=$rc)"
          exit 1
