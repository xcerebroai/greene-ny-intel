name: Greene NY — Daily distress refresh

# Runs every adapter that can run unattended, rebuilds the dashboard
# payload, commits the refreshed artifacts, and deploys the static
# dashboard to GitHub Pages. The NEW-today / Last-30-days tags are
# computed against the workflow's UTC date, so each daily run produces
# a deterministic NEW set that all viewers see identically.
#
# CI-runnable sources (no operator input):
#   - tax_foreclosure_auction   AAR catalog discovery + pull
#                                (server-rendered, stdlib-reachable;
#                                seasonal — outside auction window the
#                                last good JSONL is preserved)
#   - tax_foreclosure_petition  Treasurer Annual Petition PDF + OCR
#                                (tesseract + poppler installed below)
#   - legal_notices_column      Column legal notices API
#                                (Greene-property filter applied)
#
# CI-BLOCKED sources (require operator-supplied cookies — Cloudflare
# Managed Challenge fires on every actionable request even with
# playwright-stealth, see runs/greene_ny/recon/stealth_recon_2026-05-25.md):
#   - clerk_land_records       SearchIQS (cf_clearance + ASP.NET session)
#   - supreme_court_foreclosure NYSCEF Supreme (cf_clearance + JSESSIONID)
#   - surrogate_court_probate   NYSCEF Surrogate (same cookies)
#   - webcivil_supreme          WebCivil Supreme (cf_clearance)
#   - websurrogate              WebSurrogate (cf_clearance)
# Once an operator pastes cookie values into GitHub Actions secrets
# (`SEARCHIQS_COOKIES`, `NYSCEF_COOKIES`), add steps that export those
# env vars and invoke the stealth adapters. The adapters themselves are
# not yet implemented; they are punch-listed.

on:
  schedule:
    # 11:17 UTC daily ≈ 7:17 AM ET — late enough that
    # newspaper-published legal notices for the day are in place, and
    # early enough that the lead board is fresh for the operator.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      auction_id:
        description: "Optional AAR auctionId override (default: discover)"
        required: false
        type: string

permissions:
  contents: write   # commit refreshed data/ + dashboard/ back to main
  # GitHub Pages for this repo is configured in LEGACY branch-serving
  # mode (`build_type: legacy`, source = main / root). The commit step
  # below is the deploy mechanism — pushing `dashboard/*` to `main`
  # makes it live at https://xcerebroai.github.io/greene-ny-intel/
  # dashboard/ within ~60 s. No actions/deploy-pages needed.

concurrency:
  group: greene-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (tesseract + poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
          tesseract --version
          pdftoppm -v 2>&1 | head -1

      - name: Python deps (jsonschema for §4.32 contract validation)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-refresh.txt
          python -c "import jsonschema; print('jsonschema', jsonschema.__version__)"

      # AAR auction pulls — historical 3738 (2022, 87 lots) + current
      # discovery (or operator-supplied auctionId). `--append` merges
      # by raw_record_id so both auctions coexist in the JSONL.
      - name: AAR tax-foreclosure auction — historical 3738
        run: |
          set +e
          python scrapers/tax_foreclosure_auction.py --auction-id 3738 --append
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: AAR tax-foreclosure auction — current (discovery or override)
        id: aar
        run: |
          set +e
          if [ -n "${{ inputs.auction_id }}" ]; then
            python scrapers/tax_foreclosure_auction.py --auction-id "${{ inputs.auction_id }}" --append
          else
            python scrapers/tax_foreclosure_auction.py --auction-id 6892 --append
            # Plus seasonal-discovery for an active/upcoming Greene auction.
            python scrapers/tax_foreclosure_auction.py --append
          fi
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      # Treasurer petition pulls — historical text-layer years (2019,
      # 2020, 2022) via Wayback + current 2025 via the live county
      # site. `--append` keeps all years in the JSONL; auto text-layer
      # detection means tesseract only runs on the OCR-only years.
      - name: Treasurer petition — 2019 (text-layer, Wayback)
        run: |
          set +e
          python scrapers/tax_foreclosure_petition.py --petition-year 2019 \
            --petition-url "https://web.archive.org/web/2024id_/https://www.greenegovernment.com/wp-content/uploads/2019/04/2019-Petition-Notice-of-Foreclosure.pdf" \
            --append
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: Treasurer petition — 2020 (text-layer, Wayback)
        run: |
          set +e
          python scrapers/tax_foreclosure_petition.py --petition-year 2020 \
            --petition-url "https://web.archive.org/web/2024id_/https://www.greenegovernment.com/wp-content/uploads/2020/02/Petition-Notice-of-Foreclosure-2.20.2020.pdf" \
            --append
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: Treasurer petition — 2022 (text-layer, Wayback)
        run: |
          set +e
          python scrapers/tax_foreclosure_petition.py --petition-year 2022 \
            --petition-url "https://web.archive.org/web/2024id_/https://www.greenegovernment.com/wp-content/uploads/2022/05/Petition-Notice-of-Foreclosure-4.21.2022.pdf" \
            --append
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: Treasurer petition — 2025 (current, PDF + OCR)
        id: petition
        run: |
          set +e
          python scrapers/tax_foreclosure_petition.py --petition-year 2025 --append
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: Column legal notices (90-day window)
        id: column
        run: |
          set +e
          python scrapers/legal_notices_column.py --days-back 90
          rc=$?
          echo "rc=$rc"
          if [ $rc -eq 4 ]; then exit 4; fi
          exit 0

      - name: Run staged pipeline
        run: python runs/greene_ny/build/run_greene_pipeline.py

      - name: Rebuild dashboard payload (recency tagged)
        run: python runs/greene_ny/build/adapt_to_elpaso_renderer.py

      - name: Show refresh summary
        run: |
          python - <<'PY'
          import json
          d = json.load(open('dashboard/data.json'))
          print(f"refresh_date        : {d.get('refresh_date')}")
          print(f"semantic_verdict    : {d.get('semantic_verdict')}")
          print(f"lead_total          : {d.get('lead_total')}")
          print(f"new_today_count     : {d.get('new_today_count')}")
          print(f"last_30_days_count  : {d.get('last_30_days_count')}")
          print(f"sources_active      : {d.get('sources_active')}")
          PY

      - name: Commit refreshed artifacts
        env:
          GIT_COMMITTER_NAME: greene-refresh-bot
          GIT_COMMITTER_EMAIL: refresh-bot@xcerebro.local
          GIT_AUTHOR_NAME: greene-refresh-bot
          GIT_AUTHOR_EMAIL: refresh-bot@xcerebro.local
        run: |
          git config user.name "greene-refresh-bot"
          git config user.email "refresh-bot@xcerebro.local"
          # data/raw/*.jsonl is gitignored — adapters re-pull it each run.
          # Commit pipeline outputs + dashboard payload only.
          git add \
            data/dashboard.json \
            data/scored_leads.json \
            data/matched_leads.json \
            data/evidence_ledger.json \
            data/source_heartbeat.json \
            data/runs/latest.manifest.json \
            dashboard/data.json \
            dashboard/data.js \
            dashboard/data/dashboard.json \
            dashboard/data/scored_leads.json \
            dashboard/data/matched_leads.json \
            dashboard/data/evidence_ledger.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "greene-ny: daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      # Pages deploy IS the commit step above. Repo Pages is in legacy
      # main-branch serving mode; `actions/deploy-pages` would conflict
      # (it requires `build_type: workflow` + an `environment:
      # github-pages` deployment, neither of which is set here on
      # purpose). Live dashboard refreshes the moment the commit lands.

      - name: Verify dashboard live
        run: |
          sleep 30   # Pages cache flush ≈ 10–60 s after a main push
          set -e
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://xcerebroai.github.io/greene-ny-intel/dashboard/data.json")
          echo "data.json HTTP status: $status"
          test "$status" = "200" || (echo "Live dashboard fetch failed"; exit 1)
          # Lead-total sanity — full backfill should yield > 1000.
          # If we ever drop below 800, something silently broke a
          # historical pull and the run should fail.
          live_total=$(curl -sS \
            "https://xcerebroai.github.io/greene-ny-intel/dashboard/data.json" \
            | python -c "import json,sys; print(json.load(sys.stdin)['lead_total'])")
          echo "Live lead_total: $live_total"
          test "$live_total" -gt 800
